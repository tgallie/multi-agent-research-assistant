name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev,ui]"
      - name: Lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Black format
        run: black --check .
      - name: Tests
        run: pytest --cov-report=term-missing --cov-fail-under=70
