[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "guarded-research-agent"
version = "0.1.0"
description = "A bounded, observable multi-agent research assistant reference implementation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "httpx==0.28.1",
  "langgraph==0.6.7",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "typer==0.16.1",
]

[project.optional-dependencies]
ui = ["fastapi==0.116.1", "jinja2==3.1.6", "uvicorn==0.35.0"]
dev = [
  "black==25.1.0",
  "fastapi==0.116.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
]

[project.scripts]
research-agent = "agent.cli:app"
research-eval = "agent.evaluation:app"
research-ui = "agent.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=agent --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]
