<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guarded Research Agent</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17191c;
        --muted: #616870;
        --paper: #f4f5f2;
        --surface: #ffffff;
        --line: #d8dcd7;
        --accent: #087f5b;
        --accent-dark: #056247;
        --warn: #a54719;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      header, main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; }
      header { padding: 32px 0 18px; border-bottom: 1px solid var(--line); }
      h1 { margin: 0; font-size: clamp(26px, 4vw, 40px); font-weight: 700; letter-spacing: 0; }
      .eyebrow { color: var(--accent-dark); font-size: 12px; font-weight: 700; text-transform: uppercase; }
      main { padding: 28px 0 56px; }
      form { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
      label { display: grid; gap: 8px; font-weight: 650; }
      textarea {
        width: 100%; min-height: 104px; resize: vertical; padding: 13px 14px;
        border: 1px solid #aeb5ae; border-radius: 6px; background: var(--surface);
        color: var(--ink); font: inherit;
      }
      textarea:focus { outline: 3px solid #bce9d9; border-color: var(--accent); }
      button {
        min-height: 44px; padding: 0 20px; border: 0; border-radius: 6px;
        background: var(--accent); color: white; font: inherit; font-weight: 700; cursor: pointer;
      }
      button:hover { background: var(--accent-dark); }
      button:disabled { opacity: .55; cursor: wait; }
      #status { min-height: 24px; margin: 14px 0; color: var(--muted); }
      .result { display: none; border-top: 1px solid var(--line); padding-top: 24px; }
      .result.visible { display: block; }
      .summary { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 18px; color: var(--muted); }
      .summary strong { color: var(--ink); }
      h2 { margin: 24px 0 10px; font-size: 19px; letter-spacing: 0; }
      #answer { white-space: pre-wrap; background: var(--surface); border-left: 4px solid var(--accent); padding: 18px; }
      .source { padding: 12px 0; border-bottom: 1px solid var(--line); }
      .source a { color: var(--accent-dark); font-weight: 650; }
      details { border-bottom: 1px solid var(--line); padding: 12px 0; }
      summary { cursor: pointer; font-weight: 650; }
      pre { overflow-x: auto; white-space: pre-wrap; color: var(--muted); }
      .warning { color: var(--warn); font-weight: 700; }
      @media (max-width: 680px) {
        form { grid-template-columns: 1fr; }
        button { width: 100%; }
        header, main { width: min(100% - 24px, 1080px); }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="eyebrow">Bounded multi-agent system</div>
      <h1>Guarded Research Agent</h1>
    </header>
    <main>
      <form id="research-form">
        <label>
          Research question
          <textarea id="question" required minlength="3" maxlength="2000">Compare the launch years of Hubble and the James Webb Space Telescope and identify which launched later.</textarea>
        </label>
        <button id="submit" type="submit">Run research</button>
      </form>
      <div id="status" role="status" aria-live="polite"></div>
      <section id="result" class="result" aria-live="polite">
        <div class="summary">
          <span>Confidence <strong id="confidence"></strong></span>
          <span>Duration <strong id="duration"></strong></span>
          <span>Tool calls <strong id="tool-calls"></strong></span>
          <span>Model calls <strong id="model-calls"></strong></span>
          <span>Estimated cost <strong id="cost"></strong></span>
          <span id="budget"></span>
        </div>
        <h2>Answer</h2>
        <div id="answer"></div>
        <h2>Sources</h2>
        <div id="sources"></div>
        <h2>Reasoning summary</h2>
        <p id="reasoning"></p>
        <h2>Trace</h2>
        <div id="trace"></div>
      </section>
    </main>
    <script>
      const form = document.querySelector("#research-form");
      const submit = document.querySelector("#submit");
      const status = document.querySelector("#status");
      const result = document.querySelector("#result");
      const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[char]);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submit.disabled = true;
        result.classList.remove("visible");
        status.textContent = "Research in progress...";
        try {
          const response = await fetch("/api/research", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: document.querySelector("#question").value })
          });
          if (!response.ok) throw new Error(`Request failed (${response.status})`);
          const data = await response.json();
          document.querySelector("#confidence").textContent = `${Math.round(data.output.confidence * 100)}%`;
          document.querySelector("#duration").textContent = `${data.duration_ms} ms`;
          document.querySelector("#tool-calls").textContent = data.usage.tool_calls;
          document.querySelector("#model-calls").textContent = data.usage.model_calls;
          document.querySelector("#cost").textContent = `$${data.estimated_cost_usd.toFixed(5)}`;
          document.querySelector("#budget").innerHTML = data.output.budget_exceeded
            ? '<span class="warning">Budget exceeded</span>' : "Within budget";
          document.querySelector("#answer").textContent = data.output.answer;
          document.querySelector("#reasoning").textContent = data.output.reasoning_summary;
          document.querySelector("#sources").innerHTML = data.output.sources.length
            ? data.output.sources.map((source) => `<div class="source"><a href="${escapeHtml(source.url)}" target="_blank" rel="noreferrer">${escapeHtml(source.title)}</a><div>${escapeHtml(source.snippet)}</div></div>`).join("")
            : "No sources returned.";
          document.querySelector("#trace").innerHTML = data.trace.map((item, index) =>
            `<details ${index === 0 ? "open" : ""}><summary>${index + 1}. ${escapeHtml(item.node)} · ${escapeHtml(item.event)}</summary><pre>${escapeHtml(JSON.stringify(item.detail, null, 2))}</pre></details>`
          ).join("");
          status.textContent = `Run ${data.status}.`;
          result.classList.add("visible");
        } catch (error) {
          status.textContent = error.message;
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
